<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slitta</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10201c;--mute:#5d716b;--line:#d5e0dc;--brand:#0f766e;--on:#fff;--soft:#d9efea;--warn:#fff1d6;--warnink:#8a4b05;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0d1715;--card:#15231f;--ink:#e6f1ee;--mute:#92aaa3;--line:#27382f;--brand:#4fd1c0;--on:#06201c;--soft:#1d3a34;--warn:#3a2a0c;--warnink:#f5c06b;--bad:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
main{max-width:680px;margin:0 auto;padding:16px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1{margin:8px 0 0;font-size:34px;letter-spacing:-1px}
#date{margin:0 0 18px;color:var(--mute);text-transform:capitalize}
h2{font-size:18px;margin:24px 0 8px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--brand);color:var(--on);font-weight:600}
.btn.ghost{background:var(--soft);color:var(--brand)}.btn.bad{background:transparent;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px}
.time{min-width:48px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;color:var(--mute)}
.sub{font-size:14px;color:var(--mute)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none}
#late{background:var(--warn);border-radius:18px;padding:4px 14px 10px;margin-top:8px}
#late h2{color:var(--warnink);margin-top:12px}
.late{border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.chip{border:2px solid var(--brand);background:transparent;color:var(--brand);border-radius:12px;padding:8px 12px;font-weight:600;text-align:left}
.chip small{display:block;font-weight:400;color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.day{font-size:14px;color:var(--mute);margin:12px 0 4px;text-transform:capitalize}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.bar{gap:6px}.bar .btn{padding:10px 12px;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
dialog{border:0;border-radius:18px;padding:20px;width:min(420px,calc(100% - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,15,12,.55)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=date],input[type=time],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.two{display:flex;gap:10px}.two>div{flex:1}
.end{display:flex;gap:8px;margin-top:18px}.end .sp{flex:1}
#remind{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.rem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand);color:var(--on);border-radius:14px;padding:12px 14px}
.rem .t{font-weight:700}.rem .sub{color:inherit;opacity:.85}
.rem .btn{background:var(--on);color:var(--brand)}
#remList{margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Slitta</h1>
  <p id="date"></p>
  <section id="remind" hidden aria-live="assertive"></section>
  <section id="late" hidden aria-live="polite"><h2>Da riprogrammare</h2><div id="lateList"></div></section>
  <h2>Oggi</h2><div id="todayList"></div>
  <h2>Prossimi giorni</h2><div id="nextList"></div>
</main>
<div class="bar">
  <button class="btn" id="newBtn">+ Nuovo appuntamento</button>
  <button class="btn ghost" id="notifBtn"></button>
  <button class="btn ghost" id="cfgBtn" aria-label="Impostazioni">⚙️</button>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="dlgT" style="margin:0">Nuovo appuntamento</h3>
    <label for="fT">Cosa devi fare</label><input type="text" id="fT" required maxlength="120">
    <div class="two">
      <div><label for="fD">Giorno</label><input type="date" id="fD" required></div>
      <div><label for="fH">Ora</label><input type="time" id="fH" required></div>
    </div>
    <label for="fL">Durata</label>
    <select id="fL"><option value="15">15 minuti</option><option value="30" selected>30 minuti</option><option value="45">45 minuti</option><option value="60">1 ora</option><option value="90">1 ora e 30</option><option value="120">2 ore</option></select>
    <div class="end">
      <button type="button" class="btn bad" id="fDel">Elimina</button><span class="sp"></span>
      <button type="button" class="btn ghost" id="fNo">Annulla</button>
      <button type="submit" class="btn">Salva</button>
    </div>
  </form>
</dialog>

<dialog id="remDlg" aria-labelledby="remT">
  <h3 id="remT" style="margin:0">Appuntamento in arrivo</h3>
  <div id="remList"></div>
  <div class="end"><span class="sp"></span><button type="button" class="btn" id="remOk">Ho visto</button></div>
</dialog>

<dialog id="cfgDlg">
  <form id="cfgForm" method="dialog">
    <h3 style="margin:0">Impostazioni</h3>
    <p class="sub">Slitta propone i nuovi orari solo dentro questa fascia.</p>
    <div class="two">
      <div><label for="cS">Inizio giornata</label><input type="time" id="cS" required></div>
      <div><label for="cE">Fine giornata</label><input type="time" id="cE" required></div>
    </div>
    <h4 style="margin:20px 0 4px">Backup</h4>
    <p class="sub">I dati restano su questo dispositivo. Scarica un file per non perderli o per spostarli.</p>
    <div class="acts">
      <button type="button" class="btn ghost" id="expBtn">Scarica backup</button>
      <button type="button" class="btn ghost" id="impBtn">Ripristina da file</button>
      <input type="file" id="impFile" accept="application/json" hidden>
    </div>
    <p class="sub" id="cfgMsg" role="status"></p>
    <div class="end"><span class="sp"></span>
      <button type="button" class="btn ghost" id="cNo">Chiudi</button>
      <button type="submit" class="btn">Salva</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const KEY = 'slitta.v1', CFG = 'slitta.cfg', STEP = 15;
let WORK = [9 * 60, 18 * 60]; // fascia in cui propone gli spostamenti (modificabile dalle impostazioni)
try { const c = JSON.parse(localStorage.getItem(CFG) || 'null'); if (c && c.s < c.e) WORK = [c.s, c.e]; } catch (e) {}
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) { alert('Impossibile salvare i dati in questo browser.'); } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const p2 = n => String(n).padStart(2, '0');
const isoD = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const isoT = d => p2(d.getHours()) + ':' + p2(d.getMinutes());
const start = i => new Date(i.date + 'T' + i.time);
const end = i => new Date(+start(i) + (i.dur || 30) * 60000);
const dayLbl = d => d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

// ---- Cerca il primo spazio libero dentro l'orario di lavoro ----
function overlaps(a, b, exceptId) {
  return items.some(o => o.status === 'open' && o.id !== exceptId && start(o) < b && end(o) > a);
}
function freeFrom(from, dur, exceptId) {
  const d = new Date(from); d.setSeconds(0, 0);
  d.setMinutes(Math.ceil(d.getMinutes() / STEP) * STEP);
  for (let n = 0; n < 14 * 96; n++) {
    const m = d.getHours() * 60 + d.getMinutes();
    if (m >= WORK[0] && m + dur <= WORK[1] && !overlaps(d, new Date(+d + dur * 60000), exceptId)) return new Date(d);
    d.setMinutes(d.getMinutes() + STEP);
  }
  return d;
}
function suggest(i) {
  const now = new Date(), soon = new Date(+now + 10 * 60000), dur = i.dur || 30, o = start(i);
  const tmr = new Date(now); tmr.setDate(tmr.getDate() + 1); tmr.setHours(o.getHours(), o.getMinutes());
  const wk = new Date(o); wk.setDate(wk.getDate() + 7);
  const raw = [['Prima occasione', soon], ['Domani', tmr], ['Settimana prossima', wk]];
  const out = [];
  for (const [label, from] of raw) {
    const d = freeFrom(from < soon ? soon : from, dur, i.id);
    if (!out.some(x => +x.d === +d)) out.push({ label, d });
  }
  return out;
}

// ---- Azioni ----
function moveTo(i, d) { i.date = isoD(d); i.time = isoT(d); i.moved = (i.moved || 0) + 1; armReminders(i); save(); render(); }
function toggle(i, v) { i.status = v ? 'done' : 'open'; if (v) delete i.rem; save(); render(); }

// ---- Disegno ----
function card(i) {
  const row = el('div', 'card row' + (i.status === 'done' ? ' done' : ''));
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = i.status === 'done';
  cb.setAttribute('aria-label', 'Fatto'); cb.onchange = () => toggle(i, cb.checked);
  const g = el('div', 'grow'); g.tabIndex = 0; g.setAttribute('role', 'button');
  g.append(el('div', 't', i.title), el('div', 'sub', i.dur + ' min' + (i.moved ? ' · spostato ' + i.moved + (i.moved > 1 ? ' volte' : ' volta') : '')));
  g.onclick = () => openDlg(i);
  g.onkeydown = e => { if (e.key === 'Enter') openDlg(i); };
  row.append(cb, el('div', 'time', i.time), g);
  return row;
}
function lateCard(i) {
  const c = el('div', 'card late');
  c.append(el('div', 't', i.title));
  c.append(el('div', 'sub', 'Era previsto ' + dayLbl(start(i)) + ' alle ' + i.time + (i.moved ? ' · già spostato ' + i.moved + 'x' : '')));
  const chips = el('div', 'chips');
  for (const s of suggest(i)) {
    const b = el('button', 'chip', s.label); b.type = 'button';
    b.append(el('small', '', dayLbl(s.d) + ' alle ' + isoT(s.d)));
    b.onclick = () => moveTo(i, s.d);
    chips.append(b);
  }
  const a = el('div', 'acts');
  const done = el('button', 'btn ghost', 'Fatto'); done.onclick = () => toggle(i, true);
  const other = el('button', 'btn ghost', 'Scegli tu'); other.onclick = () => openDlg(i);
  const del = el('button', 'btn bad', 'Elimina'); del.onclick = () => { if (confirm('Eliminare "' + i.title + '"?')) { items = items.filter(x => x.id !== i.id); save(); render(); } };
  a.append(done, other, del);
  c.append(chips, a);
  return c;
}
function render() {
  const now = new Date(), today = isoD(now);
  $('#date').textContent = now.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const byTime = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
  const late = items.filter(i => i.status === 'open' && end(i) <= now).sort(byTime);
  const lateIds = new Set(late.map(i => i.id));
  const rest = items.filter(i => !lateIds.has(i.id)).sort(byTime);
  $('#late').hidden = !late.length;
  $('#lateList').replaceChildren(...late.map(lateCard));
  const pend = pending(now);
  $('#remind').hidden = !pend.length;
  $('#remind').replaceChildren(...pend.map(i => remBanner(i, now)));
  const nAlert = late.length + pend.length;
  document.title = (nAlert ? '(' + nAlert + ') ' : '') + 'Slitta';
  const t = rest.filter(i => i.date === today);
  $('#todayList').replaceChildren(...(t.length ? t.map(card) : [el('div', 'empty', 'Niente in programma per oggi.')]));
  const nb = $('#nextList'); nb.replaceChildren();
  const fut = rest.filter(i => i.date > today && i.status === 'open');
  if (!fut.length) nb.append(el('div', 'empty', 'Nessun appuntamento nei prossimi giorni. Premi "+ Nuovo appuntamento".'));
  let last = '';
  for (const i of fut) { if (i.date !== last) { nb.append(el('div', 'day', dayLbl(start(i)))); last = i.date; } nb.append(card(i)); }
}

// ---- Finestra di modifica ----
let editId = null;
function openDlg(i) {
  editId = i ? i.id : null;
  $('#dlgT').textContent = i ? 'Modifica appuntamento' : 'Nuovo appuntamento';
  const d = new Date(); d.setSeconds(0, 0); d.setMinutes(Math.ceil((d.getMinutes() + 1) / STEP) * STEP);
  $('#fT').value = i ? i.title : '';
  $('#fD').value = i ? i.date : isoD(d);
  $('#fH').value = i ? i.time : isoT(d);
  $('#fL').value = i ? i.dur : 30;
  $('#fDel').style.display = i ? '' : 'none';
  $('#dlg').showModal(); $('#fT').focus();
}
$('#newBtn').onclick = () => openDlg(null);
$('#fNo').onclick = () => $('#dlg').close();
$('#fDel').onclick = () => { if (!confirm('Eliminare questo appuntamento?')) return; items = items.filter(x => x.id !== editId); save(); $('#dlg').close(); render(); };
$('#form').onsubmit = e => {
  const data = { title: $('#fT').value.trim(), date: $('#fD').value, time: $('#fH').value, dur: +$('#fL').value };
  if (!data.title || !data.date || !data.time) return;
  const a = new Date(data.date + 'T' + data.time), b = new Date(+a + data.dur * 60000);
  const clash = items.find(o => o.status === 'open' && o.id !== editId && start(o) < b && end(o) > a);
  if (clash && !confirm('Si sovrappone a "' + clash.title + '". Salvare lo stesso?')) { e.preventDefault(); return; }
  if (editId) { const i = items.find(x => x.id === editId); const changed = i.date !== data.date || i.time !== data.time; Object.assign(i, data); if (changed) armReminders(i); }
  else { const n = { id: uid(), status: 'open', moved: 0, ...data }; armReminders(n); items.push(n); }
  save(); render();
};

// ---- Impostazioni e backup ----
const toMin = t => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };
const fromMin = m => p2(Math.floor(m / 60)) + ':' + p2(m % 60);
$('#cfgBtn').onclick = () => { $('#cS').value = fromMin(WORK[0]); $('#cE').value = fromMin(WORK[1]); $('#cfgMsg').textContent = ''; $('#cfgDlg').showModal(); };
$('#cNo').onclick = () => $('#cfgDlg').close();
$('#cfgForm').onsubmit = e => {
  const a = toMin($('#cS').value), b = toMin($('#cE').value);
  if (a >= b) { e.preventDefault(); $('#cfgMsg').textContent = 'La fine della giornata deve essere dopo l\'inizio.'; return; }
  WORK = [a, b];
  try { localStorage.setItem(CFG, JSON.stringify({ s: a, e: b })); } catch (x) {}
  render();
};
$('#expBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ items, work: WORK }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'slitta-backup-' + isoD(new Date()) + '.json'; a.click(); URL.revokeObjectURL(a.href);
  $('#cfgMsg').textContent = 'Backup scaricato.';
};
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items)) throw 0;
    if (!confirm('Questo sostituirà gli appuntamenti attuali. Continuare?')) return;
    items = d.items.filter(i => i && i.title && i.date && i.time).map(i => ({ id: i.id || uid(), status: i.status === 'done' ? 'done' : 'open', moved: i.moved || 0, dur: i.dur || 30, title: i.title, date: i.date, time: i.time }));
    save(); render(); $('#cfgMsg').textContent = 'Ripristinati ' + items.length + ' appuntamenti.';
  } catch (x) { $('#cfgMsg').textContent = 'File non valido: scegli un backup creato da Slitta.'; }
  e.target.value = '';
};

// ---- Avvisi di sistema ----
async function notify(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, tag, icon: 'icon-192.png', badge: 'icon-192.png', requireInteraction: true, vibrate: [200, 100, 200] };
  try {
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg && reg.showNotification) { await reg.showNotification(title, opts); return; }
    new Notification(title, opts);
  } catch (e) { try { new Notification(title, { body }); } catch (x) {} }
}
function notifLabel() {
  const ok = 'Notification' in window;
  $('#notifBtn').textContent = !ok ? 'Avvisi non supportati' : Notification.permission === 'granted' ? 'Avvisi attivi' : 'Attiva avvisi';
  $('#notifBtn').disabled = !ok || Notification.permission === 'granted';
}
$('#notifBtn').onclick = () => Notification.requestPermission().then(notifLabel);

// ---- Promemoria: 30 e 15 minuti prima ----
const LEADS = [15, 30];     // minuti prima dell'inizio, dal più vicino al più lontano
const ESCALATE_MS = 60000;  // se non confermi entro 1 minuto compare il popup
const minsLeft = (i, now) => Math.max(1, Math.round((start(i) - now) / 60000));
// Riarma i promemoria: le soglie già superate al momento dell'inserimento o dello spostamento vengono saltate
function armReminders(i) {
  const ms = start(i) - new Date();
  i.n1 = 0; i.n2 = 0; delete i.rem;
  i.rf = LEADS.filter(l => ms < l * 60000);
}
const pending = now => items.filter(i => i.status === 'open' && i.rem && start(i) > now);
function ack(i) { delete i.rem; save(); render(); }
function fireReminder(i, lead, now) {
  i.rf = Array.from(new Set((i.rf || []).concat(LEADS.filter(l => l >= lead))));
  i.rem = { lead, at: +now };
  notify('Tra ' + minsLeft(i, now) + ' min: ' + i.title, 'Alle ' + i.time, 'slitta-' + i.id + '-' + lead);
}
function remBanner(i, now) {
  const c = el('div', 'rem');
  const g = el('div', 'grow'); g.style.cursor = 'default';
  g.append(el('div', 't', '⏰ Tra ' + minsLeft(i, now) + ' min: ' + i.title), el('div', 'sub', 'Alle ' + i.time));
  const ok = el('button', 'btn', 'Ok'); ok.onclick = () => ack(i);
  const mv = el('button', 'btn', 'Sposta'); mv.onclick = () => { ack(i); openDlg(i); };
  c.append(g, ok, mv);
  return c;
}
let shown = [];
function remPopupRow(i, now) {
  const c = el('div', 'card row');
  const g = el('div', 'grow'); g.style.cursor = 'default';
  g.append(el('div', 't', i.title), el('div', 'sub', 'Tra ' + minsLeft(i, now) + ' min · alle ' + i.time));
  const mv = el('button', 'btn ghost', 'Sposta'); mv.type = 'button';
  mv.onclick = () => { ack(i); $('#remDlg').close(); openDlg(i); };
  c.append(g, mv);
  return c;
}
function ackShown() {
  shown.forEach(id => { const i = items.find(x => x.id === id); if (i) delete i.rem; });
  shown = []; save(); render();
}
// Popup: compare se un promemoria non è stato confermato entro ESCALATE_MS
function escalate(now) {
  const dlg = $('#remDlg');
  const due = pending(now).filter(i => now - i.rem.at >= ESCALATE_MS);
  if (!due.length) { if (dlg.open) dlg.close(); return; }
  if (!dlg.open && document.querySelector('dialog[open]')) return; // non interrompe chi sta scrivendo
  shown = due.map(i => i.id);
  $('#remList').replaceChildren(...due.map(i => remPopupRow(i, now)));
  if (!dlg.open) { dlg.showModal(); $('#remOk').focus(); }
}
$('#remOk').onclick = () => { ackShown(); $('#remDlg').close(); };
$('#remDlg').addEventListener('cancel', ackShown);

function tick() {
  const now = new Date(); let ch = false;
  for (const i of items) {
    if (i.status !== 'open') continue;
    const ms = start(i) - now;
    if (ms > 0) {
      const lead = LEADS.find(l => ms <= l * 60000 && !(i.rf || []).includes(l));
      if (lead) { fireReminder(i, lead, now); ch = true; }
    } else if (i.rem) { delete i.rem; ch = true; }
    if (!i.n1 && start(i) <= now && end(i) > now) { notify('Ora: ' + i.title, 'Inizia adesso', 'slitta-' + i.id + '-now'); i.n1 = 1; ch = true; }
    if (!i.n2 && end(i) <= now) { notify('Non fatto: ' + i.title, 'Apri Slitta per riprogrammarlo', 'slitta-' + i.id + '-late'); i.n2 = 1; ch = true; }
  }
  if (ch) save();
  render();
  escalate(now);
}
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
window.addEventListener('focus', tick);
document.querySelectorAll('dialog').forEach(d => d.addEventListener('close', () => setTimeout(tick, 0)));
notifLabel(); tick();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
